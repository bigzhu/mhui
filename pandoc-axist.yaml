from: markdown+table_captions+pipe_tables+multiline_tables+table_attributes+emoji+auto_identifiers
to: pdf
pdf-engine: tectonic
template: templates/axist.latex
standalone: true
number-sections: false
toc: true
toc-depth: 3
metadata:
  lang: zh-CN
filters:
  - scripts/table-widths.lua
variables:
  fontsize: 12pt
  mainfont: "PingFang SC"
  sansfont: "PingFang SC"
  monofont: "Menlo"
  CJKmainfont: "PingFang SC"
  CJKsansfont: "PingFang SC"
  color: "2C2C2C" # neutral dark tone
  linkcolor: "4A4A4A"
  geometry: "margin=1.7cm"
  linestretch: 1.2
